<div class="page">
    <section class="hero" aria-label="Project">
        <h1>{{ project.project_name }}</h1>
        <p *ngIf="project.live_note">{{ project.live_note }}</p>
        <a class="button" [href]="project.live_url" target="_blank" rel="noopener noreferrer">Open the live app</a>
    </section>

    <section *ngIf="screenshots.length" aria-labelledby="screenshots-h">
        <h2 id="screenshots-h" class="label">Screenshots</h2>
        <figure>
            <img [src]="screenshots[current]" [alt]="'Screenshot ' + (current + 1) + ' of ' + project.project_name">
        </figure>
        <div class="controls">
            <button class="button" type="button" (click)="showScreenshot(current - 1)">Previous screenshot</button>
            <span class="counter" aria-live="polite">{{ current + 1 }} of {{ screenshots.length }}</span>
            <button class="button" type="button" (click)="showScreenshot(current + 1)">Next screenshot</button>
        </div>
    </section>

    <section aria-labelledby="brief-h">
        <h2 id="brief-h" class="label">The brief</h2>
        <div class="prose" [innerHTML]="problem"></div>
    </section>

    <section aria-labelledby="code-h">
        <h2 id="code-h" class="label">Code</h2>
        <iframe #iframe [title]="'Source code for ' + project.project_name"></iframe>
    </section>

    <section aria-labelledby="procedure-h">
        <h2 id="procedure-h" class="label">How I built it</h2>
        <div class="prose" [innerHTML]="writeup"></div>
    </section>
</div>
